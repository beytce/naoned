<html lang="fr">

      content="Jeu de commerce multijoueur, gratuit, sur PC et mobile. Chaque mois, tout le monde repart à zéro ; le meilleur devient Doge."

    <meta property="og:image:height" content="630" />

    <link rel="icon" href="/favicon.png" type="image/png" />
