name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Version from package.json (packageManager).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what the server runs.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The load of a lagoon (docs/plan-socle.md A7): a short run, under 10 % of a core.
      - run: pnpm --filter @comptoirs/server charge 24 30 30
      - run: pnpm --filter @comptoirs/web build

  # The first session on two phones (apps/web/e2e/layout.mjs): fails on anything written over
  # something else in the HUD, a target under 44 px, or a page scrolling sideways.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @comptoirs/web exec playwright-core install --with-deps chromium
      - run: pnpm --filter @comptoirs/web build
      - run: pnpm --filter @comptoirs/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-shots
          path: apps/web/e2e-shots
          retention-days: 14

  # The walk-throughs of the board (docs/e2e.md), which the job above does not play: the solo ones
  # against the built site, the others each with its own server. Those that hang on the day of the
  # week start their server on a Wednesday (CLOCK_START). One job each: a failure names its own.
  planche:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seul
            run: |
              pnpm exec vite preview --port 5173 --strictPort &
              for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5173/ && break; sleep 1; done
              for t in planche ile passe rang; do MODE=seul node e2e/$t.mjs; done
          - name: arsenal
            run: node e2e/arsenal.mjs
          - name: compagnie
            run: node e2e/compagnie.mjs
          - name: guerre
            run: CLOCK_START=2026-11-11T10:00:00Z node e2e/guerre.mjs
          - name: assaut
            run: CLOCK_START=2026-11-11T10:00:00Z node e2e/assaut.mjs
          # These two start their server again at the days they need: one view each, they are long.
          - name: semaine-tel
            run: ONLY=p node e2e/semaine.mjs
          - name: semaine-pc
            run: ONLY=d node e2e/semaine.mjs
          - name: maree-tel
            run: ONLY=p node e2e/maree.mjs
          - name: maree-pc
            run: ONLY=d node e2e/maree.mjs
    name: planche (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @comptoirs/web exec playwright-core install --with-deps chromium
      - run: pnpm --filter @comptoirs/web build
      - run: ${{ matrix.run }}
        working-directory: apps/web
        shell: bash -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: planche-shots-${{ matrix.name }}
          path: apps/web/e2e-shots
          retention-days: 14
